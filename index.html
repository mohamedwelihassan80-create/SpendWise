<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet" type="text/css"
    <title>SpendWise</title>
</head>
<body>

    <h1>My Budget Tracker</h1>

    <p> Track income and expenses in one place</p>

    <section class="add-expense">
    
        <form id="Expense-form">
            <label for="expense-name">Expense name</label>
            <input type="text" id="expense-name" name="expense-name" placeholder="write expense-name here">

            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="Enter amount here"

            <label for="category">Category</label>
            <select id= "category" name="category">
                <option value="bill">Bill</option>
                <option value="food">Food</option>
                <option value="electricity">Electricity</option>
            </select>
       </form>
    </section>

    <section class="your-expenses">
        <h2>Your Expenses</h2>
        <p>No expenses yet</p>
    </section>
        
    
    
</body>
</html>
