<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.jpg" alt="SpendWise Logo" width="30">
                SpendWise
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <span class="icon">📊</span> Dashboard
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            
            <!-- HEADER -->
            <header class="header">
                <div class="header-title">
                    <h1>Overview</h1>
                    <p>Welcome back, Mohamedweli</p>
                </div>
                <div class="header-actions">
                    <!-- Total Balance Display -->
                    <div class="total-balance">
                        Balance: <span id="balance-display">Ksh 0</span>
                    </div>
                </div>
            </header>

            <!-- INPUT FORM -->
            <section class="input-section">
                <h2>Add Expense</h2>
                <form id="expense-form">
                    <input type="text" id="expense-name" placeholder="Expense Name" required>
                    <input type="number" id="expense-amount" placeholder="Amount (Ksh)" required min="1">
                    <select id="expense-category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Rent">Rent</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Savings">Savings</option>
                        <option value="Utilities">Utilities</option>
                    </select>
                    <button type="submit" class="btn-primary">Add Expense</button>
                </form>
            </section>

            <!-- DYNAMIC DASHBOARD GRID -->
            <section class="dashboard-grid" id="dashboard-cards">
                <!-- Cards will be injected here by JavaScript -->
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
